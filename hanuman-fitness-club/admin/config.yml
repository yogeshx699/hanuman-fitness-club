backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "home"
    label: "Home Page"
    files:
      - name: "content"
        label: "Content"
        file: "index.html"
        fields:
          # Hero
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "text" }
          - { label: "Hero Button Text", name: "hero_btn_text", widget: "string" }
          - { label: "Hero Background Image", name: "hero_bg", widget: "image" }
          
          # Services Section
          - { label: "Services Title", name: "services_title", widget: "string" }
          - { label: "Services Subtitle", name: "services_subtitle", widget: "string" }
          # Service 1
          - { label: "Service 1 Icon", name: "service1_icon", widget: "string" }
          - { label: "Service 1 Title", name: "service1_title", widget: "string" }
          - { label: "Service 1 Description", name: "service1_desc", widget: "text" }
          # Service 2
          - { label: "Service 2 Icon", name: "service2_icon", widget: "string" }
          - { label: "Service 2 Title", name: "service2_title", widget: "string" }
          - { label: "Service 2 Description", name: "service2_desc", widget: "text" }
          # Service 3
          - { label: "Service 3 Icon", name: "service3_icon", widget: "string" }
          - { label: "Service 3 Title", name: "service3_title", widget: "string" }
          - { label: "Service 3 Description", name: "service3_desc", widget: "text" }

          # About
          - { label: "About Title", name: "about_title", widget: "string" }
          - { label: "About Text 1", name: "about_text1", widget: "text" }
          - { label: "About Text 2", name: "about_text2", widget: "text" }
          - { label: "About Address", name: "about_address", widget: "text" }
          - { label: "About Image", name: "about_image", widget: "image" }

          # Gallery
          - { label: "Gallery Title", name: "gallery_title", widget: "string" }
          - { label: "Gallery Subtitle", name: "gallery_subtitle", widget: "string" }
          # For simplicity, we treat each gallery image as a separate field. You can add more if needed.
          - { label: "Gallery Image 1", name: "gallery_image1", widget: "image" }
          - { label: "Gallery Image 2", name: "gallery_image2", widget: "image" }
          - { label: "Gallery Image 3", name: "gallery_image3", widget: "image" }
          - { label: "Gallery Image 4", name: "gallery_image4", widget: "image" }

          # Testimonials
          - { label: "Testimonials Title", name: "testimonials_title", widget: "string" }
          # Testimonial 1
          - { label: "Testimonial 1 Quote", name: "quote1", widget: "text" }
          - { label: "Testimonial 1 Client Photo", name: "client1_photo", widget: "image" }
          - { label: "Testimonial 1 Client Name", name: "client1_name", widget: "string" }
          # Testimonial 2
          - { label: "Testimonial 2 Quote", name: "quote2", widget: "text" }
          - { label: "Testimonial 2 Client Photo", name: "client2_photo", widget: "image" }
          - { label: "Testimonial 2 Client Name", name: "client2_name", widget: "string" }
          # Testimonial 3
          - { label: "Testimonial 3 Quote", name: "quote3", widget: "text" }
          - { label: "Testimonial 3 Client Photo", name: "client3_photo", widget: "image" }
          - { label: "Testimonial 3 Client Name", name: "client3_name", widget: "string" }

          # Contact
          - { label: "Contact Title", name: "contact_title", widget: "string" }
          - { label: "Contact Subtitle", name: "contact_subtitle", widget: "string" }
          - { label: "Address", name: "address", widget: "text" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Booking Button Text", name: "booking_btn", widget: "string" }