backend:
  name: git-gateway
  branch: main

# Media settings
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Optional publishing workflow (draft → review → publish)
publish_mode: editorial_workflow

# Site-wide settings
site_url: "https://yourdomain.com"
display_url: "https://yourdomain.com"

# Collections
collections:

  # ======================
  # PAGES (STATIC CONTENT)
  # ======================
  - name: "pages"
    label: "Pages"
    files:

      - name: "home"
        label: "Home Page"
        file: "content/pages/home.md"
        fields:

          # HERO SECTION
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Background Image", name: "bg_image", widget: "image" }
              - { label: "CTA Text", name: "cta_text", widget: "string" }
              - { label: "CTA Link", name: "cta_link", widget: "string" }

          # ABOUT SECTION
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }

          # SEO SETTINGS
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string" }
              - { label: "Meta Description", name: "meta_description", widget: "text" }
              - { label: "Keywords", name: "keywords", widget: "list" }

  # ======================
  # SERVICES COLLECTION
  # ======================
  - name: "services"
    label: "Services"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    preview_path: "services/{{slug}}"
    fields:
      - { label: "Service Title", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "string", required: false }
      - { label: "Icon (FontAwesome / SVG)", name: "icon", widget: "string" }
      - { label: "Short Description", name: "description", widget: "text" }
      - { label: "Detailed Content", name: "body", widget: "markdown" }

  # ======================
  # TESTIMONIALS
  # ======================
  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Client Name", name: "client_name", widget: "string", required: true }
      - { label: "Client Photo", name: "client_photo", widget: "image" }
      - { label: "Rating (1-5)", name: "rating", widget: "number", min: 1, max: 5, default: 5 }
      - { label: "Feedback", name: "quote", widget: "text" }

  # ======================
  # GALLERY
  # ======================
  - name: "gallery"
    label: "Gallery"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Image", name: "image", widget: "image", required: true }
      - { label: "Alt Text (SEO)", name: "alt", widget: "string", required: true }
      - { label: "Category", name: "category", widget: "string" }

  # ======================
  # BLOG (OPTIONAL - HIGHLY RECOMMENDED)
  # ======================
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "thumbnail", widget: "image" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Content", name: "body", widget: "markdown" }
      - { label: "Tags", name: "tags", widget: "list" }
